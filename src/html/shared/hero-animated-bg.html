<div class="hero-animated-bg" aria-hidden="true">
    <div class="hero-grid-overlay hero-grid-animated"></div>

    <div class="hero-shoot-lines">
        <div class="hero-shoot-line hero-shoot-line--cyan hero-shoot-line--w60"  style="top: 8%;  animation-delay: 0s;"></div>
        <div class="hero-shoot-line hero-shoot-line--purple hero-shoot-line--w90" style="top: 19%; animation-delay: 1.2s;"></div>
        <div class="hero-shoot-line hero-shoot-line--pink hero-shoot-line--w120" style="top: 30%; animation-delay: 2.4s;"></div>
        <div class="hero-shoot-line hero-shoot-line--cyan hero-shoot-line--w150" style="top: 41%; animation-delay: 0.6s;"></div>
        <div class="hero-shoot-line hero-shoot-line--purple hero-shoot-line--w60"  style="top: 52%; animation-delay: 3s;"></div>
        <div class="hero-shoot-line hero-shoot-line--pink hero-shoot-line--w90"  style="top: 63%; animation-delay: 1.8s;"></div>
        <div class="hero-shoot-line hero-shoot-line--cyan hero-shoot-line--w120" style="top: 74%; animation-delay: 2.8s;"></div>
        <div class="hero-shoot-line hero-shoot-line--purple hero-shoot-line--w150" style="top: 85%; animation-delay: 0.9s;"></div>
    </div>

    <div class="hero-scan-line"></div>

    <div class="hero-rings">
        <div class="hero-ring hero-ring--1"></div>
        <div class="hero-ring hero-ring--2"></div>
        <div class="hero-ring hero-ring--3"></div>
    </div>

    <div class="hero-blur-orb hero-blur-orb--purple"></div>
    <div class="hero-blur-orb hero-blur-orb--pink"></div>

    <div class="hero-stars-field">
        {% for i in range(40) %}
        <span class="hero-star hero-star--{{ (i % 3) + 1 }}" style="left: {{ (i * 2.5) }}%; top: {{ ((i * 4.7) % 98) + 1 }}%; animation-delay: {{ (i * 0.15) }}s; animation-duration: {{ 5 + (i % 4) }}s;"></span>
        {% endfor %}
    </div>

    <div class="hero-center-glow"></div>
    <div class="hero-bottom-fade"></div>
</div>
